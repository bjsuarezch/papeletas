<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Papeletas S-24</title>
  <meta name="theme-color" content="#a34d28">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Papeletas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
  <style>
    /* ============ TEMA TERRACOTA ============ */
    :root {
      --bg: #f1e9da; --card: #fcf7ec; --text: #402e22; --muted: #8a7561;
      --accent: #a34d28; --accent-2: #96755f; --accent-text: #ffffff;
      --input-bg: #faf3e5; --border: #dcc8ac; --radius: 6px;
      --font-head: Georgia, "Times New Roman", serif;
      --font-body: Georgia, "Times New Roman", serif;
      --shadow: 0 1px 4px rgba(100,60,30,.10);
      --card-border: 1.5px solid #e3d3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; justify-content: center; padding: 20px 12px 40px;
    }
    .contenedor { width: 100%; max-width: 420px; }

    /* ============ ICONOS SVG ============ */
    .ico { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -2px; }
    .ico-md { width: 1.4em; height: 1.4em; vertical-align: -3px; }
    .ico-lg { width: 56px; height: 56px; }

    /* ============ TARJETAS ============ */
    .tarjeta {
      background: var(--card); border-radius: var(--radius); padding: 24px 20px;
      box-shadow: var(--shadow); border: var(--card-border); margin-bottom: 16px;
      animation: aparecer .35s ease both;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    .tarjeta:nth-child(1) { animation-delay: 0s; }
    .tarjeta:nth-child(2) { animation-delay: .05s; }

    h1 { font-size: 1.3rem; margin-bottom: 4px; font-family: var(--font-head); display: flex; align-items: center; gap: 8px; }
    .sub { color: var(--muted); font-size: .85rem; margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 5px; }
    input, select {
      width: 100%; padding: 12px; font-size: 1.05rem; font-family: var(--font-body);
      border: 1.5px solid var(--border); border-radius: calc(var(--radius) - 1px);
      background: var(--input-bg); color: var(--text);
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    .fila { display: flex; gap: 10px; }
    .fila > div { flex: 1; }
    button, a.boton {
      display: block; width: 100%; margin-top: 12px; padding: 14px; font-size: 1.02rem;
      font-weight: 700; font-family: var(--font-head); text-align: center; text-decoration: none;
      color: var(--accent-text); background: var(--accent);
      border: none; border-radius: calc(var(--radius) - 1px); cursor: pointer;
      transition: filter .15s, transform .08s;
    }
    button:active, a.boton:active { filter: brightness(.92); transform: scale(.99); }
    .secundario { background: var(--accent-2); }
    .error {
      background: #f9e3dc; color: #a33020; border: 1px solid #e8b8a8; border-radius: 8px;
      padding: 10px 12px; font-size: .88rem; margin-bottom: 8px;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .hint { font-size: .78rem; color: var(--muted); margin-top: 3px; }
    .ok { font-size: 2.2rem; text-align: center; color: var(--accent); }
    .resumen {
      background: color-mix(in srgb, var(--accent) 8%, var(--card));
      border-radius: calc(var(--radius) - 1px); padding: 12px 14px;
      font-size: .92rem; line-height: 1.7; margin: 12px 0;
    }
    .resumen b { float: right; }
    .pasos {
      background: color-mix(in srgb, var(--accent) 10%, var(--card));
      border-radius: calc(var(--radius) - 1px); padding: 12px 14px 12px 30px; margin-top: 10px;
    }
    .pasos li { font-size: .9rem; margin: 6px 0; }
    .oculto { display: none; }
    h2 { font-size: 1.05rem; margin-bottom: 8px; font-family: var(--font-head); display: flex; align-items: center; gap: 8px; }

    /* ============ TABLET / iPAD: APARIENCIA MÁS ESPACIOSA ============ */
    @media (min-width: 900px) {
      body { padding: 32px 24px 60px; }
      .tarjeta { padding: 28px 26px; }
      h1 { font-size: 1.45rem; }
      input, select { padding: 13px; }
      button, a.boton { padding: 15px; }
      /* Boton principal acotado */
      #btn-generar { max-width: 360px; margin-left: auto; margin-right: auto; }
    }

    /* ============ ACCESIBILIDAD: REDUCIR ANIMACIONES ============ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!-- ============ SPRITE DE ICONOS SVG ============ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-clipboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
      </symbol>
      <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </symbol>
      <symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>
      </symbol>
      <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </symbol>
    </defs>
  </svg>

  <div class="contenedor">

    <!-- ============ FORMULARIO ============ -->
    <div class="tarjeta" id="vista-formulario">
      <h1><svg class="ico" aria-hidden="true"><use href="#i-clipboard"/></svg> Papeleta S-24</h1>
      <p class="sub">Registro de transacción — conteo de cajas</p>

      <div class="error oculto" id="error">
        <svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg>
        <span id="error-texto"></span>
      </div>

      <form id="formulario">
        <label for="fecha">Fecha de la reunión</label>
        <input type="date" id="fecha" required>

        <div class="fila">
          <div>
            <label for="obra"><svg class="ico" aria-hidden="true"><use href="#i-globe"/></svg> Obra mundial</label>
            <input type="text" inputmode="numeric" id="obra" placeholder="0" required autocomplete="off">
          </div>
          <div>
            <label for="congregacion"><svg class="ico" aria-hidden="true"><use href="#i-building"/></svg> Salón (congreg.)</label>
            <input type="text" inputmode="numeric" id="congregacion" placeholder="0" required autocomplete="off">
          </div>
        </div>
        <p class="hint">Escribe solo los números; el formato de miles se pone solo.</p>

        <label for="rellenado_por">Rellenado por (tú)</label>
        <input type="text" id="rellenado_por" required autocomplete="name">

        <label for="verificado_por">Verificado por (compañero)</label>
        <input type="text" id="verificado_por" required autocomplete="off">

        <button type="submit" id="btn-generar">
          <svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#i-check"/></svg>
          Generar y compartir
        </button>
      </form>
    </div>

    <!-- ============ RESULTADO ============ -->
    <div class="tarjeta oculto" id="vista-listo">
      <div class="ok"><svg class="ico-lg" aria-hidden="true"><use href="#i-check"/></svg></div>
      <h1 style="text-align:center;justify-content:center">Papeleta generada</h1>

      <div class="resumen" id="resumen"></div>

      <button id="btn-compartir">
        <svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#i-share"/></svg>
        Compartir (WhatsApp / Drive)
      </button>
      <button class="secundario" id="btn-descargar">
        <svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#i-download"/></svg>
        Descargar PDF
      </button>
      <button class="secundario" id="btn-nueva">
        <svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#i-plus"/></svg>
        Nueva papeleta
      </button>

      <ol class="pasos" id="pasos-compartir">
        <li>Toca <b>Compartir</b></li>
        <li>Elige <b>WhatsApp</b> y el grupo de la congregación → enviar</li>
        <li>Para <b>Drive</b>: comparte de nuevo y elige <b>Drive</b> → guardar en la carpeta</li>
      </ol>
    </div>

  </div>

  <script src="pdf-lib.min.js"></script>
  <script src="plantilla.js"></script>
  <script src="rellenar.js"></script>
  <script>
  (function () {
    "use strict";

    // ---------- Estado ----------
    var ultimoPdf = null;

    // ---------- Utilidades ----------
    function $(id) { return document.getElementById(id); }
    function hoy() {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function fechaBonita(iso) { var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
    function cargarJSON(c, d) { try { return JSON.parse(localStorage.getItem(c)) || d; } catch (e) { return d; } }
    function guardarConfig(extra) {
      var c = cargarJSON("s24_config", {});
      Object.keys(extra).forEach(function (k) { c[k] = extra[k]; });
      localStorage.setItem("s24_config", JSON.stringify(c));
    }
    function mostrarError(msg) {
      $("error-texto").textContent = msg;
      $("error").classList.remove("oculto");
    }
    function totalDe(r) {
      return Rellenar.formatearMonto(Rellenar.montoAEntero(r.obra) + Rellenar.montoAEntero(r.congregacion));
    }
    function textoResumen(r) {
      return "📋 Papeleta S-24 — " + r.fecha + "\n" +
        "🌍 Obra mundial: " + r.obra + "\n" +
        "🏛️ Salón: " + r.congregacion + "\n" +
        "💰 TOTAL: " + totalDe(r) + "\n" +
        "✍️ " + r.rellenadoPor + " · ✔️ " + r.verificadoPor;
    }

    // ---------- Inicializacion ----------
    $("fecha").value = hoy();
    var config = cargarJSON("s24_config", {});
    $("rellenado_por").value = config.rellenado_por || "";
    $("verificado_por").value = config.verificado_por || "";

    // Si el navegador no soporta compartir archivos (iOS en HTTP), cambiar instrucciones
    if (!soportaCompartir()) {
      $("pasos-compartir").innerHTML =
        "<li>Toca <b>Descargar PDF</b>: se abre en una pestaña nueva</li>" +
        "<li>En esa pestaña usa el botón <b>Compartir</b> de Safari (cuadrado con flecha ↑)</li>" +
        "<li>Elige <b>WhatsApp</b> → el grupo → enviar. Igual para <b>Drive</b></li>";
      $("btn-descargar").innerHTML =
        '<svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#i-share"/></svg>Abrir PDF';
    }

    // ---------- Generar papeleta ----------
    $("formulario").addEventListener("submit", async function (ev) {
      ev.preventDefault();
      $("error").classList.add("oculto");
      var btn = $("btn-generar");
      btn.disabled = true;
      btn.innerHTML = "Generando...";

      try {
        var obra = Rellenar.formatearMonto($("obra").value);
        var cong = Rellenar.formatearMonto($("congregacion").value);
        var rellenadoPor = $("rellenado_por").value.trim();
        var verificadoPor = $("verificado_por").value.trim();
        var fechaIso = $("fecha").value;
        if (!fechaIso || !rellenadoPor || !verificadoPor) {
          throw new Error("Completa la fecha y ambos nombres.");
        }

        var datos = {
          fecha: fechaBonita(fechaIso),
          obra: obra,
          congregacion: cong,
          rellenadoPor: rellenadoPor,
          verificadoPor: verificadoPor
        };
        var bytes = await Rellenar.generarPapeleta(PDFLib, PLANTILLA_B64, datos);

        var ahora = new Date();
        var nombreArchivo = "S-24_" + fechaIso + "_" +
          String(ahora.getHours()).padStart(2, "0") + String(ahora.getMinutes()).padStart(2, "0") + ".pdf";

        ultimoPdf = { bytes: bytes, nombreArchivo: nombreArchivo, datos: datos };

        guardarConfig({ rellenado_por: rellenadoPor, verificado_por: verificadoPor });

        mostrarResultado(datos);
        // Auto-compartir SOLO si el navegador lo soporta (nunca auto-descargar)
        var archivoPrueba = new File([bytes], nombreArchivo, { type: "application/pdf" });
        if (navigator.canShare && navigator.canShare({ files: [archivoPrueba] })) {
          compartir(false);
        }
      } catch (err) {
        mostrarError(err.message || "Revisa los datos ingresados.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#i-check"/></svg>Generar y compartir';
      }
    });

    function mostrarResultado(datos) {
      $("resumen").innerHTML =
        "Fecha <b>" + datos.fecha + "</b><br>" +
        "<svg class=\"ico\" style=\"color:var(--accent)\" aria-hidden=\"true\"><use href=\"#i-globe\"/></svg> Obra mundial <b>" + datos.obra + "</b><br>" +
        "<svg class=\"ico\" style=\"color:var(--accent)\" aria-hidden=\"true\"><use href=\"#i-building\"/></svg> Salón (congregación) <b>" + datos.congregacion + "</b><br>" +
        "TOTAL <b>" + totalDe(datos) + "</b><br>" +
        "Rellenado por <b>" + datos.rellenadoPor + "</b><br>" +
        "Verificado por <b>" + datos.verificadoPor + "</b>";
      $("vista-formulario").classList.add("oculto");
      $("vista-listo").classList.remove("oculto");
      $("vista-listo").style.animation = "none"; void $("vista-listo").offsetWidth;
      $("vista-listo").style.animation = "aparecer .35s ease both";
      window.scrollTo(0, 0);
    }

    // ---------- Compartir / descargar ----------
    function compartir(mostrarFallback) {
      if (!ultimoPdf) return;
      var archivo = new File([ultimoPdf.bytes], ultimoPdf.nombreArchivo, { type: "application/pdf" });
      // iOS no mezcla archivo + texto/titulo (bug de WebKit): la hoja de compartir
      // no se abre si el objeto lleva text junto a files. En iOS va SOLO el archivo.
      var datos = { files: [archivo] };
      if (!esIOS()) {
        datos.text = textoResumen(ultimoPdf.datos);
        datos.title = "Papeleta S-24";
      }
      if (navigator.canShare && navigator.canShare(datos)) {
        navigator.share(datos).catch(function () {});
      } else {
        descargar();
        if (mostrarFallback !== false) {
          alert("Tu navegador no soporta compartir archivos directamente.\n" +
                "El PDF se abrió en una pestaña nueva: desde ahí puedes compartirlo o guardarlo.");
        }
      }
    }

    function esIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
             (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function soportaCompartir() {
      try {
        var f = new File([new Blob(["x"])], "x.pdf", { type: "application/pdf" });
        return !!(navigator.canShare && navigator.canShare({ files: [f] }));
      } catch (e) { return false; }
    }

    function descargar() {
      if (!ultimoPdf) return;
      var blob = new Blob([ultimoPdf.bytes], { type: "application/pdf" });
      var url = URL.createObjectURL(blob);
      if (esIOS()) {
        // iOS no "descarga" PDFs: los muestra. Abrir en pestana NUEVA para no perder la app.
        window.open(url, "_blank");
      } else {
        var a = document.createElement("a");
        a.href = url; a.download = ultimoPdf.nombreArchivo;
        document.body.appendChild(a); a.click(); a.remove();
      }
      // La URL debe vivir hasta que la pestana nueva la cargue
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    }

    $("btn-compartir").addEventListener("click", function () { compartir(true); });
    $("btn-descargar").addEventListener("click", descargar);
    $("btn-nueva").addEventListener("click", function () {
      $("vista-listo").classList.add("oculto");
      $("vista-formulario").classList.remove("oculto");
      $("obra").value = "";
      $("congregacion").value = "";
      $("fecha").value = hoy();
      window.scrollTo(0, 0);
    });

    // ---------- Service worker ----------
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  })();
  </script>
</body>
</html>
