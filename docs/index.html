<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Papeletas S-24</title>
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Papeletas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    /* ============ TEMA MATRIX ============ */
    :root {
      --bg: #000000; --card: rgba(0,20,0,.85); --text: #c8ffd4; --muted: #4f9e5e;
      --accent: #00ff41; --accent-2: #003b00; --accent-text: #000000;
      --input-bg: rgba(0,30,0,.6); --border: #00a832; --radius: 4px;
      --font-head: "Share Tech Mono", "Roboto Mono", monospace;
      --font-body: "Share Tech Mono", "Roboto Mono", monospace;
      --shadow: 0 0 22px rgba(0,255,65,.15);
      --card-border: 1px solid rgba(0,255,65,.4);
      --sheen: rgba(0,255,65,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: var(--font-body);
      background-color: #000;
      background-image:
        repeating-linear-gradient(0deg, rgba(0,255,65,.025) 0 1px, transparent 1px 3px),
        radial-gradient(600px 400px at 50% 0%, rgba(0,255,65,.10), transparent 70%);
      color: var(--text); height: 100vh; height: 100dvh;
      display: flex; justify-content: center;
      padding: calc(20px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
      color-scheme: dark;
      overflow: hidden;
    }
    .contenedor {
      width: 100%; max-width: 420px; height: 100%;
      overflow-y: auto; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .contenedor::-webkit-scrollbar { width: 0; display: none; }

    /* ============ ICONOS SVG ============ */
    .ico { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -2px; }
    .ico-lg { width: 56px; height: 56px; }
    .ico-marca { display: inline-block; width: 1.35em; height: 1.35em; vertical-align: -3px; }

    /* ============ CABECERA ============ */
    .cabecera { margin-bottom: 18px; animation: aparecer .5s ease both; }
    .marca {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-head); font-size: 1.7rem; font-weight: 700; line-height: 1.1;
      color: var(--text);
    }
    .cabecera .sub { color: var(--muted); font-size: .86rem; margin-top: 4px; }

    /* ============ TARJETAS ============ */
    .tarjeta {
      background: var(--card); border-radius: var(--radius); padding: 24px 20px;
      box-shadow: var(--shadow); border: var(--card-border); margin-bottom: 16px;
      animation: aparecer .35s ease both;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    .tarjeta:nth-child(1) { animation-delay: 0s; }
    .tarjeta:nth-child(2) { animation-delay: .05s; }

    h1 { font-size: 1.3rem; margin-bottom: 4px; font-family: var(--font-head); display: flex; align-items: center; gap: 8px; }
    .sub { color: var(--muted); font-size: .85rem; margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 5px; }
    input {
      width: 100%; padding: 12px; font-size: 1.05rem; font-family: var(--font-body);
      border: 1.5px solid var(--border); border-radius: calc(var(--radius) - 1px);
      background: var(--input-bg); color: var(--text);
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    .fila { display: flex; gap: 10px; }
    .fila > div { flex: 1; }
    button, a.boton {
      display: block; width: 100%; margin-top: 12px; padding: 14px; font-size: 1.02rem;
      font-weight: 700; font-family: var(--font-head); text-align: center; text-decoration: none;
      color: var(--accent-text); background: var(--accent);
      border: none; border-radius: calc(var(--radius) - 1px); cursor: pointer;
      transition: filter .15s, transform .08s;
    }
    button:active, a.boton:active { filter: brightness(.92); transform: scale(.99); }
    .secundario { background: var(--accent-2); }
    .error {
      background: #f9e3dc; color: #a33020; border: 1px solid #e8b8a8; border-radius: 8px;
      padding: 10px 12px; font-size: .88rem; margin-bottom: 8px;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .hint { font-size: .78rem; color: var(--muted); margin-top: 3px; }
    .ok { font-size: 2.2rem; text-align: center; color: var(--accent); }
    .resumen {
      background: color-mix(in srgb, var(--accent) 8%, var(--card));
      border-radius: calc(var(--radius) - 1px); padding: 12px 14px;
      font-size: .92rem; line-height: 1.7; margin: 12px 0;
    }
    .resumen b { float: right; }
    .oculto { display: none; }
    .total-vivo {
      margin-top: 10px; font-size: .95rem; font-weight: 700;
    }
    .total-vivo .monto { float: right; color: var(--accent); }
    .preview {
      margin-top: 12px; border: 1.5px solid var(--border); border-radius: calc(var(--radius) - 1px);
      overflow: hidden; background: #fff;
    }
    .preview iframe { display: block; width: 100%; height: 340px; border: none; }

    /* ============ EXTRAS MATRIX ============ */
    #matrix-canvas { position: fixed; inset: 0; z-index: -3; pointer-events: none; display: block; }
    /* resplandor verde que respira */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(720px 420px at 50% -2%, rgba(0,255,65,.18), transparent 70%);
      animation: holo 6s ease-in-out infinite;
    }
    @keyframes holo { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    /* scanlines CRT + viñeta */
    body::after {
      content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.5) 100%);
      animation: crtFlicker 4s linear infinite;
    }
    @keyframes crtFlicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: .88; }
      94% { opacity: 1; }
      97% { opacity: .94; }
      98% { opacity: 1; }
    }
    .marca { font-family: var(--font-head); font-size: 1.6rem; letter-spacing: .08em; color: #00ff41; text-shadow: 0 0 8px rgba(0,255,65,.9); position: relative; }
    .marca svg { color: #00ff41; filter: drop-shadow(0 0 6px rgba(0,255,65,.9)); }
    .cabecera .sub { color: var(--muted); font-size: .78rem; }
    .marca::after {
      content: "█"; margin-left: 2px; color: #00ff41; position: relative;
      text-shadow: 0 0 8px rgba(0,255,65,.9);
      animation: cursorBlink 1s steps(1) infinite;
    }
    @keyframes cursorBlink { 50% { opacity: 0; } }
    .marca:hover { animation: glitchRgb .28s steps(2) infinite; text-shadow: -2px 0 #ff0033, 2px 0 #00f0ff, 0 0 8px rgba(0,255,65,.9); }
    .cabecera { border-bottom: 1px solid rgba(0,255,65,.5); padding-bottom: 12px; }
    .cabecera-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .idiomas { display: flex; gap: 4px; flex: none; }
    .idiomas button {
      font-family: var(--font-head); font-size: .72rem; letter-spacing: .04em;
      background: rgba(0,30,0,.7); color: #00ff41; border: 1px solid #00a832;
      border-radius: 2px; padding: 4px 10px; cursor: pointer;
      animation: none; box-shadow: none; text-transform: none;
    }
    .idiomas button:hover { background: rgba(0,255,65,.12); }
    .idiomas button.activo {
      background: #00ff41; color: #000;
      box-shadow: 0 0 12px rgba(0,255,65,.5);
    }
    label {
      color: #00c832; font-family: var(--font-head); font-size: .78rem;
      letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
    }
    input {
      background: rgba(0,30,0,.6); border: 1px solid #00a832; color: #c8ffd4;
      border-radius: 2px; text-shadow: 0 0 6px rgba(0,255,65,.4);
    }
    input:hover { border-color: #00ff41; }
    input:focus {
      border-color: #00ff41;
      box-shadow: 0 0 0 3px rgba(0,255,65,.18), 0 0 16px rgba(0,255,65,.4);
    }
    input::placeholder { color: rgba(79,158,94,.6); }
    button, a.boton {
      background: #00ff41; color: #000; border-radius: 2px;
      font-size: .9rem; letter-spacing: .08em; text-transform: uppercase;
      box-shadow: 0 0 18px rgba(0,255,65,.55);
      animation: parpadeo 2s ease-in-out infinite;
    }
    @keyframes parpadeo {
      0%, 100% { opacity: 1; box-shadow: 0 0 18px rgba(0,255,65,.55); }
      50%      { opacity: .8; box-shadow: 0 0 30px rgba(0,255,65,.85); }
    }
    button:hover, a.boton:hover {
      filter: brightness(1.15);
      box-shadow: -3px 0 0 rgba(255,0,51,.55), 3px 0 0 rgba(0,240,255,.55), 0 0 22px rgba(0,255,65,.75);
      animation: glitchRgb .28s steps(2) infinite;
    }
    .secundario {
      background: rgba(0,30,0,.7); color: #00ff41; border: 1px solid #00a832;
      box-shadow: 0 0 10px rgba(0,255,65,.2); animation: none;
    }
    .secundario:hover { background: rgba(0,255,65,.12); }
    .error { background: rgba(90,0,0,.5); color: #ff6b5e; border: 1px solid rgba(255,60,50,.5); }
    .resumen { background: rgba(0,25,0,.7); border: 1px solid rgba(0,255,65,.35); }
    .ok { color: #00ff41; text-shadow: 0 0 18px rgba(0,255,65,.9); }
    .total-vivo .monto { color: #00ff41; text-shadow: 0 0 10px rgba(0,255,65,.8); }
    .preview { background: #001200; border-color: rgba(0,255,65,.35); }
    @keyframes glitchRgb {
      0%   { transform: translate(-1px, 0); }
      25%  { transform: translate(1px, -1px); }
      50%  { transform: translate(-1px, 1px); }
      75%  { transform: translate(1px, 1px); }
      100% { transform: translate(-1px, 0); }
    }
    /* Marco HUD de terminal */
    .tarjeta { position: relative; overflow: hidden; }
    .tarjeta::after {
      content: ""; position: absolute; inset: 5px; pointer-events: none; z-index: 1;
      border: 1px solid rgba(0,255,65,.16);
    }
    .barra-term {
      display: flex; align-items: center; gap: 6px;
      margin: -24px -20px 16px; padding: 7px 12px;
      background: rgba(0,30,0,.9); border-bottom: 1px solid rgba(0,255,65,.35);
      border-radius: 3px 3px 0 0;
      font-family: var(--font-head); font-size: .78rem; color: #00ff41;
      text-shadow: 0 0 6px rgba(0,255,65,.7); letter-spacing: .04em;
    }
    .barra-term .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .barra-term .dot-r { background: #ff2d55; box-shadow: 0 0 6px rgba(255,45,85,.6); }
    .barra-term .dot-y { background: #ffb043; box-shadow: 0 0 6px rgba(255,176,67,.6); }
    .barra-term .dot-g { background: #00ff41; box-shadow: 0 0 6px rgba(0,255,65,.6); }
    .barra-term .term-titulo { flex: 1; margin-left: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .barra-term .term-ctrl { opacity: .75; letter-spacing: .12em; }

    /* ============ TABLET / iPAD: APARIENCIA MÁS ESPACIOSA ============ */
    @media (min-width: 900px) {
      body { padding: calc(32px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left)); }
      .tarjeta { padding: 28px 26px; }
      h1 { font-size: 1.45rem; }
      input { padding: 13px; }
      button, a.boton { padding: 15px; }
      .barra-term { margin: -28px -26px 18px; }
      /* Boton principal acotado */
      #btn-generar { max-width: 360px; margin-left: auto; margin-right: auto; }
    }

    /* ============ ACCESIBILIDAD: REDUCIR ANIMACIONES ============ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>

  <!-- ============ SPRITE DE ICONOS SVG ============ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-clipboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
      </symbol>
      <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </symbol>
      <symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>
      </symbol>
      <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </symbol>
    </defs>
  </svg>

  <div class="contenedor">

    <!-- ============ CABECERA ============ -->
    <header class="cabecera">
      <div class="cabecera-top">
        <div class="marca">
          <svg class="ico-marca" aria-hidden="true"><use href="#i-clipboard"/></svg>
          <span data-i18n="marca">Papeleta S-24</span>
        </div>
        <div class="idiomas" role="group" aria-label="Idioma / Language">
          <button type="button" data-idioma="es" class="activo">Español</button>
          <button type="button" data-idioma="en">English</button>
        </div>
      </div>
      <p class="sub" data-i18n="cabecera_sub">Registro de transacción · conteo de cajas</p>
    </header>

    <!-- ============ FORMULARIO ============ -->
    <div class="tarjeta" id="vista-formulario">
      <div class="barra-term">
        <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
        <span class="term-titulo" data-i18n="term_form">C:\papeleta.exe — registro</span>
        <span class="term-ctrl">[─] [□] [✕]</span>
      </div>

      <div class="error oculto" id="error" role="alert" aria-live="polite" tabindex="-1">
        <svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg>
        <span id="error-texto"></span>
      </div>

      <form id="formulario">
        <label for="fecha" data-i18n="label_fecha">Fecha de la reunión</label>
        <input type="date" id="fecha" required>

        <div class="fila">
          <div>
            <label for="obra"><svg class="ico" aria-hidden="true"><use href="#i-globe"/></svg> <span data-i18n="label_obra">Obra mundial</span></label>
            <input type="text" inputmode="numeric" id="obra" placeholder="0" required autocomplete="off">
          </div>
          <div>
            <label for="congregacion"><svg class="ico" aria-hidden="true"><use href="#i-building"/></svg> <span data-i18n="label_cong">Salón (congreg.)</span></label>
            <input type="text" inputmode="numeric" id="congregacion" placeholder="0" required autocomplete="off">
          </div>
        </div>
        <p class="hint" data-i18n="hint_montos">Escribe solo los números; el formato de miles se pone solo.</p>

        <div class="total-vivo"><span data-i18n="total">Total</span> <span class="monto" id="total-vivo-monto">—</span></div>

        <label for="rellenado_por" data-i18n="label_rellenado">Rellenado por (tú)</label>
        <input type="text" id="rellenado_por" required autocomplete="name">

        <label for="verificado_por" data-i18n="label_verificado">Verificado por (compañero)</label>
        <input type="text" id="verificado_por" required autocomplete="off">

        <button type="submit" id="btn-generar">
          <svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="btn_generar">Generar y compartir</span>
        </button>
      </form>
    </div>

    <!-- ============ RESULTADO ============ -->
    <div class="tarjeta oculto" id="vista-listo">
      <div class="barra-term">
        <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
        <span class="term-titulo" data-i18n="term_result">C:\resultado.txt — papeleta OK</span>
        <span class="term-ctrl">[─] [□] [✕]</span>
      </div>
      <div class="ok"><svg class="ico-lg" aria-hidden="true"><use href="#i-check"/></svg></div>
      <h1 style="text-align:center;justify-content:center;color:#00ff41;text-shadow:0 0 8px rgba(0,255,65,.9)" data-i18n="h1_resultado">Papeleta generada</h1>

      <div class="resumen" id="resumen" aria-live="polite"></div>

      <div class="preview" id="preview">
        <iframe id="vista-pdf" title="Vista previa de la papeleta"></iframe>
      </div>

      <button id="btn-compartir">
        <svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#i-share"/></svg><span data-i18n="btn_compartir">Compartir</span>
      </button>
      <button class="secundario" id="btn-descargar">
        <svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="btn_descargar">Descargar PDF</span>
      </button>
      <button class="secundario" id="btn-nueva">
        <svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="btn_nueva">Nueva papeleta</span>
      </button>
    </div>

  </div>

  <script src="plantilla.js"></script>
  <script src="plantilla-en.js"></script>
  <script src="rellenar.js"></script>
  <script>
  (function () {
    "use strict";

    // ---------- Estado ----------
    var ultimoPdf = null;

    // ---------- Idiomas ----------
    var IDIOMAS = {
      es: {
        marca: "Papeleta S-24",
        cabecera_sub: "Registro de transacción · conteo de cajas",
        term_form: "C:\\papeleta.exe — registro",
        term_result: "C:\\resultado.txt — papeleta OK",
        label_fecha: "Fecha de la reunión",
        label_obra: "Obra mundial",
        label_cong: "Salón (congreg.)",
        hint_montos: "Escribe solo los números; el formato de miles se pone solo.",
        total: "Total",
        label_rellenado: "Rellenado por (tú)",
        label_verificado: "Verificado por (compañero)",
        btn_generar: "Generar y compartir",
        h1_resultado: "Papeleta generada",
        btn_compartir: "Compartir",
        btn_descargar: "Descargar PDF",
        btn_nueva: "Nueva papeleta",
        btn_abrir: "Abrir PDF",
        generando: "Generando...",
        err_completar: "Completa la fecha y ambos nombres.",
        err_digitos: "Revisa los montos: tienen demasiados dígitos.",
        err_generico: "Revisa los datos ingresados.",
        err_pdf_lib: "No se pudo cargar la librería de PDF.",
        res_fecha: "Fecha",
        res_obra: "Obra mundial",
        res_cong: "Salón (congregación)",
        res_total: "TOTAL",
        res_rellenado: "Rellenado por",
        res_verificado: "Verificado por",
        comp_obra: "Obra mundial",
        comp_cong: "Salón",
        comp_total: "TOTAL",
        share_titulo: "Papeleta S-24",
        title_app: "Papeletas S-24",
        title_resultado: "Papeleta generada",
        alert_share: "Tu navegador no soporta compartir archivos directamente.\nEl PDF se abrió en una pestaña nueva: desde ahí puedes compartirlo o guardarlo."
      },
      en: {
        marca: "Papeleta S-24",
        cabecera_sub: "Transaction record · cash count",
        term_form: "C:\\papeleta.exe — record",
        term_result: "C:\\result.txt — papeleta OK",
        label_fecha: "Meeting date",
        label_obra: "Worldwide work",
        label_cong: "Hall (congreg.)",
        hint_montos: "Type only the numbers; the thousands separator is added automatically.",
        total: "Total",
        label_rellenado: "Filled in by (you)",
        label_verificado: "Verified by (companion)",
        btn_generar: "Generate and share",
        h1_resultado: "Papeleta generated",
        btn_compartir: "Share",
        btn_descargar: "Download PDF",
        btn_nueva: "New papeleta",
        btn_abrir: "Open PDF",
        btn_abrir: "Open PDF",
        generando: "Generating...",
        err_completar: "Complete the date and both names.",
        err_digitos: "Check the amounts: too many digits.",
        err_generico: "Check the entered data.",
        err_pdf_lib: "Could not load the PDF library.",
        res_fecha: "Date",
        res_obra: "Worldwide work",
        res_cong: "Hall (congregation)",
        res_total: "TOTAL",
        res_rellenado: "Filled in by",
        res_verificado: "Verified by",
        comp_obra: "Worldwide work",
        comp_cong: "Hall",
        comp_total: "TOTAL",
        share_titulo: "Papeleta S-24",
        title_app: "Papeletas S-24",
        title_resultado: "Papeleta generated",
        alert_share: "Your browser can't share files directly.\nThe PDF opened in a new tab: from there you can share or save it."
      }
    };
    var idiomaActual = "es";
    try { idiomaActual = localStorage.getItem("s24_idioma") || "es"; } catch (e) {}
    if (idiomaActual !== "en") idiomaActual = "es";
    function t(clave) { return (IDIOMAS[idiomaActual] && IDIOMAS[idiomaActual][clave]) || clave; }
    function ajustarBotonDescarga() {
      var esFallback = !soportaCompartir();
      var claveBtn = esFallback ? "btn_abrir" : "btn_descargar";
      var icono = esFallback ? "i-share" : "i-download";
      $("btn-descargar").innerHTML =
        '<svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#' + icono + '"/></svg>' +
        '<span data-i18n="' + claveBtn + '">' + t(claveBtn) + '</span>';
    }
    function aplicarIdioma(cod) {
      idiomaActual = (cod === "en") ? "en" : "es";
      try { localStorage.setItem("s24_idioma", idiomaActual); } catch (e) {}
      document.documentElement.lang = idiomaActual;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.title = t("title_app");
      $("btn-generar").querySelector("[data-i18n]").textContent = t("btn_generar");
      ajustarBotonDescarga();
      document.querySelectorAll(".idiomas button").forEach(function (b) {
        b.classList.toggle("activo", b.getAttribute("data-idioma") === idiomaActual);
      });
    }
    document.querySelectorAll(".idiomas button").forEach(function (b) {
      b.addEventListener("click", function () { aplicarIdioma(b.getAttribute("data-idioma")); });
    });

    // ---------- Utilidades ----------
    function $(id) { return document.getElementById(id); }
    function hoy() {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function fechaBonita(iso) { var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
    function cargarJSON(c, d) { try { return JSON.parse(localStorage.getItem(c)) || d; } catch (e) { return d; } }
    function guardarConfig(extra) {
      var c = cargarJSON("s24_config", {});
      Object.keys(extra).forEach(function (k) { c[k] = extra[k]; });
      localStorage.setItem("s24_config", JSON.stringify(c));
    }
    function mostrarError(msg) {
      $("error-texto").textContent = msg;
      $("error").classList.remove("oculto");
      $("error").focus();
    }
    var pdfLibCargada = null;
    function cargarPDFLib() {
      if (pdfLibCargada) return pdfLibCargada;
      return pdfLibCargada = new Promise(function (res, rej) {
        var s = document.createElement("script");
        s.src = "pdf-lib.min.js";
        s.onload = function () { res(window.PDFLib); };
        s.onerror = function () { rej(new Error(t("err_pdf_lib"))); };
        document.head.appendChild(s);
      });
    }

    function totalDe(r) {
      return Rellenar.formatearMonto(Rellenar.montoAEntero(r.obra) + Rellenar.montoAEntero(r.congregacion));
    }
    function textoResumen(r) {
      return "📋 " + t("share_titulo") + " — " + r.fecha + "\n" +
        "🌍 " + t("comp_obra") + ": " + r.obra + "\n" +
        "🏛️ " + t("comp_cong") + ": " + r.congregacion + "\n" +
        "💰 " + t("comp_total") + ": " + totalDe(r) + "\n" +
        "✍️ " + r.rellenadoPor + " · ✔️ " + r.verificadoPor;
    }

    // ---------- Inicializacion ----------
    $("fecha").value = hoy();
    var config = cargarJSON("s24_config", {});
    $("rellenado_por").value = config.rellenado_por || "";
    $("verificado_por").value = config.verificado_por || "";

    // Si el navegador no soporta compartir archivos (iOS en HTTP), usar boton "Abrir PDF"
    aplicarIdioma(idiomaActual);
    ajustarBotonDescarga();

    // ---------- Generar papeleta ----------
    $("formulario").addEventListener("submit", async function (ev) {
      ev.preventDefault();
      $("error").classList.add("oculto");
      var btn = $("btn-generar");
      btn.disabled = true;
      btn.innerHTML = t("generando");

      try {
        var obraRaw = $("obra").value;
        var congRaw = $("congregacion").value;
        var rellenadoPor = $("rellenado_por").value.trim();
        var verificadoPor = $("verificado_por").value.trim();
        var fechaIso = $("fecha").value;
        if (!fechaIso || !rellenadoPor || !verificadoPor) {
          throw new Error(t("err_completar"));
        }
        if (String(obraRaw).replace(/\D/g, "").length > 10 || String(congRaw).replace(/\D/g, "").length > 10) {
          throw new Error(t("err_digitos"));
        }
        var obra = Rellenar.formatearMonto(obraRaw);
        var cong = Rellenar.formatearMonto(congRaw);

        var datos = {
          fecha: fechaBonita(fechaIso),
          obra: obra,
          congregacion: cong,
          rellenadoPor: rellenadoPor,
          verificadoPor: verificadoPor
        };
        var PDFLib = await cargarPDFLib();
        var plantillaActiva = (idiomaActual === "en" && typeof PLANTILLA_EN_B64 !== "undefined")
          ? PLANTILLA_EN_B64 : PLANTILLA_B64;
        var bytes = await Rellenar.generarPapeleta(PDFLib, plantillaActiva, datos);

        var ahora = new Date();
        var nombreArchivo = "S-24_" + fechaIso + "_" +
          String(ahora.getHours()).padStart(2, "0") + String(ahora.getMinutes()).padStart(2, "0") + ".pdf";

        if (ultimoPdf && ultimoPdf.url) URL.revokeObjectURL(ultimoPdf.url);
        var blobUrl = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
        ultimoPdf = { bytes: bytes, nombreArchivo: nombreArchivo, datos: datos, url: blobUrl };

        guardarConfig({ rellenado_por: rellenadoPor, verificado_por: verificadoPor });

        mostrarResultado(datos);
        // Auto-compartir SOLO si el navegador lo soporta (nunca auto-descargar)
        var archivoPrueba = new File([bytes], nombreArchivo, { type: "application/pdf" });
        if (navigator.canShare && navigator.canShare({ files: [archivoPrueba] })) {
          compartir(false);
        }
      } catch (err) {
        mostrarError(err.message || t("err_generico"));
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg class="ico" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="btn_generar">' + t("btn_generar") + '</span>';
      }
    });

    function mostrarResultado(datos) {
      $("resumen").innerHTML =
        t("res_fecha") + " <b>" + datos.fecha + "</b><br>" +
        "<svg class=\"ico\" style=\"color:var(--accent)\" aria-hidden=\"true\"><use href=\"#i-globe\"/></svg> " + t("res_obra") + " <b>" + datos.obra + "</b><br>" +
        "<svg class=\"ico\" style=\"color:var(--accent)\" aria-hidden=\"true\"><use href=\"#i-building\"/></svg> " + t("res_cong") + " <b>" + datos.congregacion + "</b><br>" +
        t("res_total") + " <b>" + totalDe(datos) + "</b><br>" +
        t("res_rellenado") + " <b>" + datos.rellenadoPor + "</b><br>" +
        t("res_verificado") + " <b>" + datos.verificadoPor + "</b>";
      $("vista-formulario").classList.add("oculto");
      $("vista-listo").classList.remove("oculto");
      if (ultimoPdf && ultimoPdf.url) $("vista-pdf").src = ultimoPdf.url;
      document.title = t("title_resultado");
      $("vista-listo").style.animation = "none"; void $("vista-listo").offsetWidth;
      $("vista-listo").style.animation = "aparecer .35s ease both";
      document.querySelector(".contenedor").scrollTop = 0;
    }

    // ---------- Compartir / descargar ----------
    function compartir(mostrarFallback) {
      if (!ultimoPdf) return;
      var archivo = new File([ultimoPdf.bytes], ultimoPdf.nombreArchivo, { type: "application/pdf" });
      // iOS no mezcla archivo + texto/titulo (bug de WebKit): la hoja de compartir
      // no se abre si el objeto lleva text junto a files. En iOS va SOLO el archivo.
      var datos = { files: [archivo] };
      if (!esIOS()) {
        datos.text = textoResumen(ultimoPdf.datos);
        datos.title = t("share_titulo");
      }
      if (navigator.canShare && navigator.canShare(datos)) {
        navigator.share(datos).catch(function () {});
      } else {
        descargar();
        if (mostrarFallback !== false) {
          alert(t("alert_share"));
        }
      }
    }

    function esIOS() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
             (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function soportaCompartir() {
      try {
        var f = new File([new Blob(["x"])], "x.pdf", { type: "application/pdf" });
        return !!(navigator.canShare && navigator.canShare({ files: [f] }));
      } catch (e) { return false; }
    }

    function descargar() {
      if (!ultimoPdf) return;
      var url = ultimoPdf.url || URL.createObjectURL(new Blob([ultimoPdf.bytes], { type: "application/pdf" }));
      var temporal = url !== ultimoPdf.url;
      if (esIOS()) {
        // iOS no "descarga" PDFs: los muestra. Abrir en pestana NUEVA para no perder la app.
        window.open(url, "_blank");
      } else {
        var a = document.createElement("a");
        a.href = url; a.download = ultimoPdf.nombreArchivo;
        document.body.appendChild(a); a.click(); a.remove();
      }
      // Si la URL era temporal, hay que liberarla; la persistente se revoca al regenerar
      setTimeout(function () { if (temporal) URL.revokeObjectURL(url); }, 60000);
    }

    $("btn-compartir").addEventListener("click", function () { compartir(true); });
    $("btn-descargar").addEventListener("click", descargar);
    $("btn-nueva").addEventListener("click", function () {
      $("vista-listo").classList.add("oculto");
      $("vista-formulario").classList.remove("oculto");
      $("obra").value = "";
      $("congregacion").value = "";
      $("fecha").value = hoy();
      document.title = t("title_app");
      actualizarTotalVivo();
      document.querySelector(".contenedor").scrollTop = 0;
    });

    // ---------- Total en vivo ----------
    // Efecto Matrix: el total "se descifra" en lugar de aparecer directo
    var _totalTimer = null;
    function descifrar(el, finalTexto) {
      var chars = "アカサタナハマヤラワ0123456789ABCDEF$#%&*";
      var t0 = performance.now();
      var dur = 350;
      var actual = el.textContent;
      var obj = { el: el, actual: actual };
      clearInterval(_totalTimer);
      _totalTimer = setInterval(function () {
        var p = (performance.now() - t0) / dur;
        if (p >= 1) {
          clearInterval(_totalTimer);
          el.textContent = finalTexto;
          return;
        }
        var visible = Math.round(p * finalTexto.length);
        var out = "";
        for (var i = 0; i < finalTexto.length; i++) {
          if (i < visible) out += finalTexto[i];
          else if (i < actual.length) out += actual[i];
          else out += chars[Math.floor(Math.random() * chars.length)];
        }
        el.textContent = out;
      }, 30);
    }
    function actualizarTotalVivo() {
      var n = 0;
      ["obra", "congregacion"].forEach(function (id) {
        var d = String($(id).value || "").replace(/\D/g, "");
        if (d) n += parseInt(d, 10);
      });
      var el = $("total-vivo-monto");
      if (n) descifrar(el, Rellenar.formatearMonto(n)); else el.textContent = "—";
    }
    $("obra").addEventListener("input", actualizarTotalVivo);
    $("congregacion").addEventListener("input", actualizarTotalVivo);
    actualizarTotalVivo();

    // ---------- Lluvia digital Matrix ----------
    (function lluvia() {
      var cv = document.getElementById("matrix-canvas");
      if (!cv || !cv.getContext) return;
      var ctx = cv.getContext("2d");
      var chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEFXYZ<>*+=|/:;._-$%&#";
      var cols = 0;
      var drops = [];
      var vel = [];
      var fontSize = 16;
      function redimensionar() {
        cv.width = window.innerWidth;
        cv.height = window.innerHeight;
        cols = Math.floor(cv.width / fontSize);
        drops = []; vel = [];
        for (var i = 0; i < cols; i++) {
          drops[i] = Math.floor(Math.random() * -80);
          vel[i] = .4 + Math.random();
        }
      }
      redimensionar();
      window.addEventListener("resize", redimensionar);
      setInterval(function () {
        if (cv.width === 0 || cv.height === 0) return;
        ctx.fillStyle = "rgba(0,0,0,.07)";
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.font = fontSize + "px 'Share Tech Mono', monospace";
        for (var i = 0; i < cols; i++) {
          var y = drops[i] * fontSize;
          if (y - fontSize > 0) {
            ctx.fillStyle = "rgba(0,200,65,.45)";
            ctx.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), i * fontSize, y - fontSize);
          }
          ctx.shadowBlur = 10; ctx.shadowColor = "#00ff41";
          ctx.fillStyle = Math.random() > .95 ? "#ffffff" : "#00ff41";
          ctx.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), i * fontSize, y);
          ctx.shadowBlur = 0;
          if (y > cv.height && Math.random() > .975) { drops[i] = 0; }
          drops[i] += vel[i];
        }
      }, 45);
    })();

    // ---------- Service worker ----------
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  })();
  </script>
